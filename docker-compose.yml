name: whatsapp-job-search

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "${REDIS_BIND}:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${EVOLUTION_API_PORT}:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - WEBHOOK_GLOBAL_ENABLED=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  email-mcp:
    profiles:
      - mcp
    build:
      context: ./mcp
      args:
        MCP_HTTP_PORT: ${MCP_HTTP_PORT}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MCP_HTTP_BIND}:${MCP_HTTP_PORT}:${MCP_HTTP_PORT}"
    environment:
      - MCP_HTTP_HOST=0.0.0.0
    depends_on:
      - redis

  email-worker:
    profiles:
      - mcp
    build:
      context: ./mcp
      args:
        MCP_HTTP_PORT: ${MCP_HTTP_PORT}
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file: .env
    depends_on:
      - redis

volumes:
  postgres_data:
  evolution_instances:
  redis_data:
